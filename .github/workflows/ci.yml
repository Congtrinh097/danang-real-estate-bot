name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: danang_realestate_secret
          POSTGRES_DB: danang_real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d danang_real_estate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://admin:danang_realestate_secret@localhost:5432/danang_real_estate
      OPENAI_API_KEY: your_test_key
      LANGCHAIN_TRACING_V2: "false"
      TENANT_STORAGE_MODE: memory
      CHECKPOINT_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python backend/agentops/migrations/init_agentops_schema.py
      - run: PYTHONPATH=backend python backend/agentops/migrations/add_user_wallet_tables.py
      - run: PYTHONPATH=backend python backend/agentops/migrations/add_user_groups_table.py
      - run: python -m pytest -q -p no:rerunfailures

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
